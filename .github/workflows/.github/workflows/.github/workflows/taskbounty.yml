name: TaskBounty Worker

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  taskbounty:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TASKBOUNTY_API_KEY: ${{ secrets.TASKBOUNTY_API_KEY }}

    steps:
      - name: Verify TaskBounty authentication
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${TASKBOUNTY_API_KEY:-}" ]; then
            echo "::error::TASKBOUNTY_API_KEY is missing"
            exit 1
          fi

          HTTP=$(curl -sS \
            -o /tmp/tasks.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${TASKBOUNTY_API_KEY}" \
            "https://www.task-bounty.com/api/v1/tasks?state=open&limit=100")

          echo "TaskBounty HTTP status: $HTTP"

          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            cat /tmp/tasks.json
            exit 1
          fi

      - name: Rank available work
        shell: python
        run: |
          import json

          with open("/tmp/tasks.json") as f:
              payload = json.load(f)

          tasks = payload.get("tasks", [])

          def score(t):
              bounty = t.get("bounty_cents", 0) / 100
              complexity = str(t.get("complexity_tag", "")).lower()
              lang = str(t.get("language", "")).lower()

              difficulty = {
                  "small": 1,
                  "easy": 1,
                  "medium": 2,
                  "large": 4,
                  "hard": 4
              }.get(complexity, 2)

              preferred = 1.3 if lang in {
                  "typescript", "javascript", "python"
              } else 1.0

              return (bounty * preferred) / difficulty

          tasks.sort(key=score, reverse=True)

          print(f"Found {len(tasks)} open bounties\n")

          for n, task in enumerate(tasks[:20], 1):
              amount = task.get("bounty_cents", 0) / 100
              print(
                  f"{n}. ${amount:.2f} | "
                  f"{task.get('language', '?')} | "
                  f"{task.get('complexity_tag', '?')} | "
                  f"{task.get('title', 'Untitled')}"
              )
              print(task.get("github_issue_url", ""))
              print()

          if not tasks:
              print("No open TaskBounty work currently available.")
